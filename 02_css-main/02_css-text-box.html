<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자와 상자</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: "Nanum Brush Script", cursive;
            line-height: 1.8;
        } 


        /* cursive는 첫 폰트가 적용이 안되었을때 적용됨 */


        h1 {
            color: rgb(85, 20, 20);
            font-size: 40px;
            font-weight: 900;
            text-align: center;
        }

        .box {
            background-color: bisque;
            width: 300px;
            height: 150px;
            border: 2px dashed green;
            padding: 20px; /* 테두리 안쪽 여백 */
            margin: 30px; /* 테두리 바깥 여백(다른 요소와의 간격) */
            box-sizing: border-box;
            /* 
               box-sizing: border-box를 사용하면
               width안에 padding과 border까지 포함해서 계산한다.
               입력창이나 카드가 부모 영역 밖으로 튀어나가는 문제를 줄일 수 있다.
            */
        }
        .rounded-box {
            background-color: brown;
            color: aliceblue;
            padding: 10px;
            margin: 10px;
            border-radius: 15px;     /* 모서리 둥글게 */
            box-shadow:  10px 10px 15px rgba(136, 12, 12, 0.342);
        }

        .responsive-box {
            background-color: aquamarine;
            width: 90%;
            max-width: 500px;
            margin: 30px auto; /* 위아래 30px, 좌우는 자동 정렬 */
        }
    </style>
</head>
<body>
    <h1>글자와 상자 꾸미기</h1>
     <!-- h태그는 제목.글자 크기는 h태그가 아닌 css로 조절 -->
    <p>CSS의 핵심은 글자를 보기 좋게 만들고, 각 요소가 차지하는 '상자'의 모양과 간격을 조절하는 것이다.</p>

    <div class="box">
        이것은 기본 상자입니다. 안쪽 여백(padding), 테두리(border), 바깥 여백(margin)을 가지고 있습니다.
    </div>

    <div class="rounded-box">
        이것은 모서리가 둥글고 그림자가 있는 상자입니다.
    </div>

    <div class="responsive-box">
        이것은 최대 너비와 box-sizing을 적용한 반응형 상자입니다.
    </div>
</body>
</html>
