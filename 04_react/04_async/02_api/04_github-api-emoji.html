<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>





    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function SearchBox({ onSearch }) {
            // 사용자의 입력을 받고, '검색' 이벤트가 발생했음을 부모에게 알린다
            // 자신이 무엇을 검색하는지 모른다. (오직 부모에게 전달만 할 뿐)

            const [inputText, setInputText] = useState('');

            const inputextToEmoji = function () {
                onSearch(inputText);
            }
            return (
                <>
                    <input
                        type="text"
                        value={inputText}
                        onChange={e => setInputText(e.target.value)} />
                    <button onClick={inputextToEmoji}>검색</button>
                </>
            )
        }

        // 부모가 주는 상태 (loading, imgURl)에 따라 화면을 다르게 보여준다.
        // 로딩중인지, 이미지가 있는지 없는지 스스로 판단하지 않는다.
        function ImageBox({ loading, imgUrl, error }) {

            if (loading) {
                return <p>로딩중...</p>;
            }
            if (error) {
                return <p>이미지 목록을 불러오지 못했습니다.</p>;
            }
            if (imgUrl) {
                return <img src={imgUrl} alt='검색한 이모지' />;
            }
            return (
                <>
                    <p>이모지를 검색해주세요 (결과 없음)</p>
                </>
            )
        }




        // 모든 데이터와 상태(로딩, 전체 이모지 목록, 검색 결과 URL)를 관리한다.
        // API 통신을 책임지고, 자식들의 행동에 따라 생태를 업데이트 한다.
        // 로딩 state
        // 이모지 목록 state
        // 검색 결과 이미지 URL
        // error state

        // 검색 로직 함수(input 값에 받은 이모지 이름을 기준으로 이모지 목록에서 일치하는거 찾아내기)
        // emojis[emojiName] 변수에 담겨있으면 대괄호 표기법 사용해야됨
        function App() {

            const [imgUrl, setImgUrl] = useState(null);     // 결과 이미지 
            const [loading, setLoading] = useState(true);   // 로딩 상태
            const [error, setError] = useState(null);   // 에러 상태
            const [api, setApi] = useState(null);  //이모지 목록들

            useEffect(() => {
                async function getApi() {
                    try {
                        const API_URL = await fetch("https://api.github.com/emojis");
                        if (!API_URL.ok) {
                            throw new Error('Error');
                            setError(error);
                        }
                        const API_URL_JSON = await API_URL.json();
                        setApi(API_URL_JSON);
                    } catch (error) {
                        console.log('이모지 목록 불러오기 실패');
                    } finally {
                        setLoading(false);
                    }
                }
                getApi();
            }, [])

            const searchEmoji = function (emo) {
                if (!api || emo.trim() === '') {
                    setImgUrl(null);
                    return;
                }
                const normalName = emo.trim().toLowerCase();

                const foundUrl = api[normalName];
                setImgUrl(foundUrl || null);
            }





            return (
                <>
                    <h1>이모지 검색기</h1>
                    {/* '무엇을 할지'가 아닌, '어떻게 해야하는지(함수)'를 알려준다*/}
                    <SearchBox onSearch={searchEmoji} />
                    <br />
                    {/* 자식에게는 현재 '상태(로딩중,에러, imgURL)'만 알려준다.*/}
                    <ImageBox loading={loading} imgUrl={imgUrl} error={error} />
                </>
            )
        }


        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>

</html>
