<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>콘솔 확인</h1>

    <script>
        //.then OR async-await 

        // 주소를 다르게 하면 404 & OK:false -> if문에 걸려서 error 객체 생성->catch문이 error객체를 받아서 처리
        const API_URL = 'https://jsonplaceholder.typicode.com/users';

        // .then() 체이닝 사용
        function fetchDataWithThen() {
            fetch(API_URL)  
            // 1단계: 서버의 응답(Response 객체)이 도착하면 실행
                .then(response => {     // 응답 받아오기
                    console.log(response);
                    // 실제 데이터본문(body) 추출하려면 .json()호출
                    // .json() 역시 Promise를 반환하므로, return해줘야 다음 .then에서 받을 수 있다.
                    // 응답값이 제대로 오지 않을경우 에러 생성-방어코드
                    // 404나 500은 reject 안됨 fetch 사용시 방어코드 사용하는것이 좋음
                    if(!response.ok) {
                        throw new Error(`HTTP error!!`);    //->reject됨
                    }
                    return response.json(); //then에서 이 값을 리턴을 해줘야 다음 then에서 데이터를 받을 수 있음
                })
                // 2단계: .json() promise가 성공적으로 완료되면, 파싱된 데이터(data)를 받아서 실행
                .then(data => {     // 본문 내용 받아오기
                    console.log('실제 데이터',data)
                })
                .catch(error => {
                    console.error('데이터를 가져오는데 실패했습니다', error); // 에러코드를 catch로 잡아서 출력
                });
                
        }

        async function fetchDatawithAsyncAwait() {
            console.log('async/await 방식으로 fetch 시작');

            try{
                // 1단계 fetch가 완료되어 response 객체가 올때까지 기다린다.
                const response = await fetch(API_URL);
                console.log(response);

                if(!response.ok) {
                    throw new Error(`HTTP error!`);
                }
                // 2단계 .json()이 완료되어 실제 데이터가 올 때까지 기다림
                const data= await response.json();
                console.log(data);
            } catch(error) {
                console.error('데이터를 가져오는데 실패함', error);
            }
        }

        // fetchDataWithThen();
        fetchDatawithAsyncAwait();
    </script>
    
</body>
</html>
