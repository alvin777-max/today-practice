<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        
        /**
        * fetch api 기본 사용 방법
        * let promise = fetch('url', [options]);  promise를 반환함
        * url: 우리가 데이터를 요청하고 싶은 서버 주소
        * [options]: 선택 매개변수(보낼수도 있고 안보낼수도 있음), http 메서드, 요청 헤더, 요청 본문 등을 객체로 지정할 수 있다.
        * 아무것도 안넣으면 기본값인 GET 방식으로 요청을 보낸다.
        */

        async function callAPI() {
            const promise = fetch('https://jsonplaceholder.typicode.com/users');
            console.log(promise);

            console.log(promise['[[promiseResult]]']);

            const response = await fetch('https://jsonplaceholder.typicode.com/users');
            console.log(response);
            // 받아온 본문을 받아오려면 한단계가 더 필요함

            // .json: 본문 내용을 JSON으로 파싱해서 자바스크립트 객체로 변환해준다
            // JS와 JAVA간에 데이터를 주고받기 위한 형식: JSON
            // 그 JSON을 파싱해서 받아옴
            // bodyused: true -> 한번 사용함 다시 읽어올수 없음 -strim 형식
            const responseJson = await response.json(); // .json 또한 비동기작업- promise반환
            console.log(responseJson);
        }
        
        callAPI();

        




    </script>

</body>

</html>
