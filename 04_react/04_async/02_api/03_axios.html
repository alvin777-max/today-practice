<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>

<body>
    <script>
        /**
        * Axios : JS에서 HTTP 요청을 보내기 위한 외부 라이브러리
        * fetch와 달리 브라우저에 기본 내장되어 있지 않아 별도로 설치를 해야 한다
        */
        const API_URL = 'https://jsonplaceholder.typicode.com/users';
        // fetch 자체는 http 에러를 reject처리 하지 않음- 방어코드로 상태 확인해야함
        async function callAlpwithFetch() {
            try {
                const response = await fetch(API_URL);
                if(!response.ok) {
                    throw new Error('error')
                }
                const data = await response.json();
                console.log(data);
            } catch (error) {
                console.error('fetch 에러');
            }
        }

        // 가볍게 처리하거나 특정 환경에서는 그냥 fetch가 axios보다 나을 수도 있음-잘 선택해서 사용
        // axios - fetch 대신 쓸 수 있음 -.then, async await 둘다 가능// http 에러도 자동으로 reject해줌
        // .json을 자동으로 해줌 / axios로 호출만해도 .data로 원하는 값 가져올 수 있음
        async function callApiWithAxios() {
            try {
                // .get() .post() 등 직관적인 메소드 사용
                // 네트워크 처리를 기다리는 비동기이므로 async/await는 사용해야함
                const response = await axios.get(API_URL); // axios는 뭘 호출하는지를 명시 (get요청)
                console.log(response);
                // json 파싱이 자동으로 되어 response.data에 담겨있음!!
                const data = response.data;
            } catch (error) {
                // axios는 4xx, 5xx HTTP에러를 자동으로 reject 처리하므로
                // catch에서 바로 잡을 수 있다
                console.log(error);
            }
        }


        callApiWithAxios();
        //callAlpwithFetch();
        
    </script>

</body>

</html>
