<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>

    



    <div id="root"></div>

    <script type="text/babel">
        const {useState, useEffect} = React;

        const API_URL = 'https://api.github.com/emojis'

        // 사용자의 입력을 받고, '검색' 이벤트가 발생했음을 부모에게 알린다
        // 자신이 무엇을 검색하는지 모른다. (오직 부모에게 전달만 할 뿐)

        

        function SearchBox({onSearch}) {
               const [inputText, setInputText] = useState('') // input state

               const handleSerchClick = () => {
                onSearch(inputText);
               }
            //이벤트핸들러
            return (
                <>
                   <input
                        type='text'
                        value={inputText}
                        onChange={e => setInputText(e.target.value)}
                    />
                    <button onClick={handleSerchClick}>검색</button>
    
                    
                </>
            )
        }

        // 부모가 주는 상태 (loading, imgURl)에 따라 화면을 다르게 보여준다.
        // 로딩중인지, 이미지가 있는지 없는지 스스로 판단하지 않는다.
        function ImageBox({imgUrl, loading, error}) {


        if(loading) {
                return <p>로딩중...</p>
         }
         if(error) {
            return <p>이모지 목록을 불러오지 못했습니다.</p>
         }
         if(imgUrl) {
            return <img src={imgUrl} alt='검색한 이모지'/>
         }
            return (
                <>
                    <p>이모지를 검색해주세요 (결과 없음)</p>

                </>
            )
        }

        


        // 모든 데이터와 상태(로딩, 전체 이모지 목록, 검색 결과 URL)를 관리한다.
        // API 통신을 책임지고, 자식들의 행동에 따라 생태를 업데이트 한다.(useEffect랑 결합- api 마운트 직후에 불러오기)
        // 로딩 state
        // 이모지 목록 state
        // 검색 결과 이미지 URL
        // error state

        // 검색 로직 함수(input 값에 받은 이모지 이름을 기준으로 이모지 목록에서 일치하는거 찾아내기)
        // emojis[emojiName] 변수에 담겨있으면 대괄호 표기법 사용해야됨

        const handleSearch = (emojiName) => {
            if ( !emojis || emojiName.trim() === '') { 
                setImgUrl(null)
                return;
            }
            const normalName = emojiName.trim().toLowerCase()
            // emojis 객체에서 normalName을 키로 가진 값을 찾는다
            const foundUrl = emojis[normalName];
            setImgUrl(foundUrl || null);  //찾았으면 url을, 못찾았으면 null 설정
            
        }
        function App() {

            const [emojis, setEmojis] = useState(null); // 이모지 목록 state
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [imgUrl, setImgUrl] = useState(null); // 검색 결과 이미지 URL

            useEffect (() => {
                async function fetchEmojis() {
                    try {
                        const response = await axios.get(API_URL);
                        console.log(response.data);
                        setEmojis(response.data);

                    }catch(error) {
                        console.error('이모지를 불러오지 못했습니다',error)
                    
                    
                } finally{
                    setLoading(false);
                }
            }
                fetchEmojis();
                 },[])
            
    
            
            return (
                <>
                    <h1>이모지 검색기</h1>
                    {/* '무엇을 할지'가 아닌, '어떻게 해야하는지(함수)를 알려준다'*/}
                    <SearchBox onSearch={handleSearch}/>
                    <br/>
                    {/*자식에게는 현재 '상태(로딩중, 에러, imgURL)'만 알려준다. */}
                    <ImageBox imgUrl={imgUrl} loading={loading} error={error}/>
                </>
            )
        }
        

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
    </script>

</body>

</html>
