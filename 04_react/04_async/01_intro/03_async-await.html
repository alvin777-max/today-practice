<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>콘솔을 확인하세요</h1>

    <script>
        function increase(number) {
            const promise = new Promise((resolve, reject) => {
                setTimeout(() => {
                    const result = number + 10;

                    if (result > 30) {
                        const e = new Error('숫자가 너무 큽니다.');
                        // 에러와 함께 실패 처리 -> .catch 매개변수로 전달
                        return reject(e);
                    }
                    // 계산된 결과와 함께 성공처리 -> .then 매개변수로 전달 된다
                    resolve(result);
                }, 1000)
            });

            return promise;
        }

        //await를 담고 있는 함수 앞에 async를 붙여줘야함. async가 붙은 함수는 값을 promise로 감싸서 반환함
        //async-await는 세트
        async function run() {
            console.log('작업 시작...');

            // 에러가 발생할 수 있는 코드는 try 블럭으로 감싼다. .catch
            try {
                // await: increase(0) Promise가 끝날 때까지 '기다렸다가',
                // resolve된 결과값을 result 변수에 할당한다.
                let result = await increase(0);   // 뒤의 작업이 다 끝나고 난 뒤의 결과값을 result에 넣겠다.
                console.log(result);        //Promise{<pending>}

                result = await increase(result);
                console.log(result);

                result = await increase(result);
                console.log(result);

                result = await increase(result);
                console.log(result);
            } catch (error) {
                // try 블록 안에서 promise가 reject되면(에러가 나면) catch블록이 실행된다.
                console.error(error);
            }
            console.log('작업이 완료 되었습니다.');
        }


        run();

// .then() .catch() async/await 상황과 의도에 맞게 사용 - 둘다 promise란 객체에서 완료된 결과값을 받아서 사용
    </script>
</body>

</html>
