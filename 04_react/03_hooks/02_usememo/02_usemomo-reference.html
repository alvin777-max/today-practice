<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        const {useState, useMemo, useEffect} = React;

        function App() {

            const [isKorea, setIsKorea] = useState(true);
            const [number, setNumber] = useState(0);

            console.log('렌더링...');
            
            // 객체를 만들기 위해 {} 사용 - {country : 한국}과 같이 객체가 생성됨
            const location = useMemo(() => {
                return { country: isKorea ? '한국' : '외국'}; //삼항 연산자 이용 true: '한국' false: '외국'
            }, [isKorea]);
                
           

            useEffect(() => {
                console.log('useEffect 호출됨.. location이 변경되었습니다')}, 
                [location]);

            // console.log({ count: '한국'} === {count: '한국'}); -참조(메모리 주소)가 다르기에 false
            // but useMemo가 기억한 객체는 이전과 동일한 객체이다.

            return (
                <>
                        <h2> 지금 당신이 있는 위치는?</h2>
                        <p>국가: {location.country}</p>
                        <button onClick = {() => setIsKorea(!isKorea)}> 국가 토글하기</button>
                        <hr/>
                        <h2>숫자를 입력해 주세요</h2>
                        <input
                            type="number"
                            value={number}
                            onChange={e => setNumber(e.target.value)}/>
                </>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
    </script>

</body>

</html>
