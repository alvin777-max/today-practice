<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        /*
          useState Hook
          -Hook: 함수형 컴포넌트가 React의 기능을 사용할 수 있게 연결해주는 함수
          -함수형 컴포넌트에서 State를 사용할 수 있게 해주는 함수이다

          props: 부모가 전달, 자식이 직접 수정하지 않음
          state: 컴포넌트 내부에서 관리, setter로 변경
        */

        // console.log(React);
        // React.useState();
        // message란 state가 변경됨
        const {useState} = React; // 객체 구조분해 할당-React란 객체에서 useSate 함수를 꺼내옴 

        function MessageManager() {
            //useState 호출 : [ 상태 값, 상태 변경 함수 ] = useState(초기값);
            const result = useState('초기값');
            console.log(result);
            // 배열 구조분해할당
            const [message, setMessage] = useState('초기 상태 메세지입니다.');      // setMessage는 useState가 setter로 만들어줌
            const [textColor, setTextColor] = useState('black');

            // 상태 변경 함수(Setter)를 호출하면 -> 컴포넌트가 '리렌더링'된다.
            // 컴포넌트 함수가 다시 실행되면서 변경된 state 값으로 JSX가 다시 만들어진다->가상 돔 구조 계산 ->디핑
            console.log('MessageManager 컴포넌트가 렌더링 되었습니다.');

            const handleEnter = () => {
                setMessage('안녕하세요! 환영합니다.');  //React의 usestate가 제공하는 상태변경함수
                setTextColor('blue');
            }

            const handleLeave = () => {
                setMessage('안녕히 가세요! 다음에 또 만나요~'); // state를 변경시키는 상태 변경함수
                setTextColor('red');
            }

            return (
                <>
                    <h1>함수형 컴포넌트 (useState)</h1>
                    <h2 style={{ color: textColor}}>{message}</h2> {/*color : black*/}
                    <button onClick={handleEnter}>입장</button> {/*호출하는게 아니라 함수명만 작성*/}
                    <button onClick={handleLeave}>퇴장</button>
                </>
            )
        }
        function Counter() {
            const [number,setNumber] = useState(0);
            
            // 함수형 업데이트: 이전 상태 값을 안전하게 사용하기
            //setter 함수의 첫번째 매개변수 (prev)에는 React가 관리하는 최신 이전 상태값이 들어온다.
            // 같은 이벤트 안에서 이전 state를 기준으로 연속 계산해야 한다면 이 방식을 사용한다.
            const increaseByTwo = () => {
                setNumber((prev) => prev + 1);  //prev는 number의 이전 상태값-React가 전달해줌
                setNumber((prev) => prev + 1);
            }

            return (
                <>
                    <h1>함수형 컴포넌트 카운터</h1>
                    <h2>현재 숫자: {number}</h2>
                    <button onClick={() => setNumber(number+1)}>+1</button>
                    <button onClick={() => setNumber(number-1)}>-1</button>
                    <button onClick={() => {
                        // 두 줄 모두 현재 렌더링 시점의 같은 number 값을 기준으로 계산
                        // React는 상태 변경을 모아서 처리하기 때문에, 의도한 +2가 아니라 +1로 동작한다
                        setNumber(number+1);
                        setNumber(number+1);        {/*같은 이벤트 안에서 한번에 몰아서 처리함->결국 1씩 증가*/}
                    }}>+2 (의도대로 안됨)</button>
                    <button onClick={increaseByTwo}>+2 (함수형 업데이트)</button>
                </>
            ) 
        }

        function App() {
            return (
                <>
                    <MessageManager/>
                    <hr/>
                    <Counter/>
                </>
            )
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
        //상태값이 바뀜 -> React가 컴포넌트 함수를 다시 실행->새로운 state로 jsx를 다시 만들고->화면을 만듬
        // 브라우저가 새로고침이 되는건 아님 리렌더링 하는거임
    </script>

</body>

</html>
